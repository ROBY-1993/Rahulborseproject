<!DOCTYPE html>
<html lang="mr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geometry Problems with Solutions - RRB</title>
    <style>
        body {
            margin: 0; padding: 0; background-color: #2c3e50;
            display: flex; flex-direction: column; justify-content: center;
            align-items: center; height: 100vh; font-family: Arial, sans-serif;
            overflow: hidden;
        }
        .flipbook-container { position: relative; width: 850px; height: 580px; perspective: 2000px; }
        .book { width: 100%; height: 100%; position: relative; transform-style: preserve-3d; }
        .page {
            width: 50%; height: 100%; position: absolute; top: 0; right: 0;
            transform-origin: left center; transform-style: preserve-3d;
            transition: transform 0.8s cubic-bezier(0.25, 1, 0.5, 1); z-index: 1;
        }
        .page-face {
            position: absolute; width: 100%; height: 100%; backface-visibility: hidden;
            box-shadow: inset 3px 0 20px rgba(0,0,0,0.2), 0 0 10px rgba(0,0,0,0.3);
            background-size: 100% 100%; background-repeat: no-repeat; background-position: center;
            background-color: white;
        }
        .front { z-index: 2; }
        .back { transform: rotateY(180deg); z-index: 1; }
        .flipped { transform: rotateY(-180deg); }
        .controls { margin-top: 25px; display: flex; gap: 20px; z-index: 100; }
        button {
            padding: 12px 35px; font-size: 16px; font-weight: bold; color: #2c3e50;
            background: #ecf0f1; border: none; border-radius: 25px; cursor: pointer;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3); transition: 0.2s;
        }
        button:hover { background: #bdc3c7; transform: scale(1.05); }
    </style>
</head>
<body>

<div class="flipbook-container">
    <div class="book" id="myBook">
        
        <!-- SHEET 1: Front Cover (2.jpg) & Page 3 -->
        <div class="page" id="s1" style="z-index: 10;">
            <div class="page-face front" style="background-image: url('2.jpg');"></div>
            <div class="page-face back" style="background-image: url('3.jpg');"></div>
        </div>
        
        <!-- SHEET 2: Page 4 & Page 5 -->
        <div class="page" id="s2" style="z-index: 9;">
            <div class="page-face front" style="background-image: url('4.jpg');"></div>
            <div class="page-face back" style="background-image: url('5.jpg');"></div>
        </div>

        <!-- SHEET 3: Page 6 & Page 7 -->
        <div class="page" id="s3" style="z-index: 8;">
            <div class="page-face front" style="background-image: url('6.jpg');"></div>
            <div class="page-face back" style="background-image: url('7.jpg');"></div>
        </div>

        <!-- SHEET 4: Page 8 & Page 9 -->
        <div class="page" id="s4" style="z-index: 7;">
            <div class="page-face front" style="background-image: url('8.jpg');"></div>
            <div class="page-face back" style="background-image: url('9.jpg');"></div>
        </div>

        <!-- SHEET 5: Page 10 & Page 11 -->
        <div class="page" id="s5" style="z-index: 6;">
            <div class="page-face front" style="background-image: url('10.jpg');"></div>
            <div class="page-face back" style="background-image: url('11.jpg');"></div>
        </div>

        <!-- SHEET 6: Page 12 & Page 13 -->
        <div class="page" id="s6" style="z-index: 5;">
            <div class="page-face front" style="background-image: url('12.jpg');"></div>
            <div class="page-face back" style="background-image: url('13.jpg');"></div>
        </div>

        <!-- SHEET 7: Page 14 & Page 15 (Thank You) -->
        <div class="page" id="s7" style="z-index: 4;">
            <div class="page-face front" style="background-image: url('14.jpg');"></div>
            <div class="page-face back" style="background-image: url('15.jpg');"></div>
        </div>

        <!-- SHEET 8: Back Cover (16.jpg) -->
        <div class="page" id="s8" style="z-index: 3;">
            <div class="page-face front" style="background-image: url('16.jpg');"></div>
            <div class="page-face back" style="background-color: #ffffff;"></div>
        </div>

    </div>
</div>

<div class="controls">
    <button onclick="prevPage()">◀ मागे (Prev)</button>
    <button onclick="nextPage()">पुढे (Next) ▶</button>
</div>

<script>
    let currentSheet = 1;
    const totalSheets = 7; // ७ वेळा पान पलटवल्यावर १५ डावीकडे आणि १६ उजवीकडे समोरासमोर थांबतील

    function nextPage() {
        if (currentSheet <= totalSheets) {
            const sheet = document.getElementById(`s${currentSheet}`);
            sheet.classList.add("flipped");
            sheet.style.zIndex = currentSheet;
            currentSheet++;
        }
    }

    function prevPage() {
        if (currentSheet > 1) {
            currentSheet--;
            const sheet = document.getElementById(`s${currentSheet}`);
            sheet.classList.remove("flipped");
            sheet.style.zIndex = totalSheets - currentSheet + 10;
        }
    }

    document.addEventListener("keydown", function(e) {
        if (e.keyCode === 39) nextPage();
        if (e.keyCode === 37) prevPage();
    });
</script>

</body>
</html>
